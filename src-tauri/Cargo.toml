[package]
name = "oasis"
version = "0.1.0"
edition = "2021"

[lib]
name = "oasis_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
ring = "0.17"
rand = "0.9"
base64 = "0.22"
chrono = "0.4"
