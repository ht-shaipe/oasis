[package]
name = "oasis-credential"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
rusqlite = { version = "0.34", features = ["bundled"] }
ring = "0.17"
rand = "0.9"
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"