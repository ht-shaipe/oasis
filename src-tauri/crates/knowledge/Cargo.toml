[package]
edition = {workspace = true}
name = "oasis-knowledge"
version = {workspace = true}

[dependencies]
ai-llm-kit = {path = "../../../../../../rust/kit/ai/llm"}
async-trait = {workspace = true}
bincode = "1"
blake3 = "1"
chrono = "0.4"
dirs-next = "2"
ignore = "0.4"
oasis-embed = {path = "../embed"}
fastembed = "5"
rusqlite = {version = "0.34", features = ["bundled"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
shellexpand = "3"
tauri = {version = "2", features = ["macos-private-api"]}
tokio = {version = "1", features = ["full"]}
tube = {workspace = true, features = ["crypto", "utils"]}
usearch = "2.25.3"
uuid = {version = "1", features = ["v4"]}
walkdir = "2"
