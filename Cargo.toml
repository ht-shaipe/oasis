[package]
authors = ["shaipe <shaipe@sina.com>"]
edition = "2024"
name = "oasis"
publish = false
version = "0.1.0"

[package.metadata.bundle]
category = "Developer Tool"
icon = ["assets/icon.png"]
identifier = "com.example.oasis"
name = "oasis"

[package.metadata.i18n]
available-locales = ["en", "zh-CN"]
default-locale = "en"
load-path = "locales"

[build-dependencies]
rust-i18n = "3"

[features]
default = ["native-app"]
# Desktop binary (system tray, etc.). Omit for `wasm32` builds: `--no-default-features --lib`.
native-app = []

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "oasis"
path = "src/main.rs"
required-features = ["native-app"]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

anyhow = "1"
autocorrect = "2.1.0"
futures = "0.3"
inventory = "0.3"
log = "0.4"
lsp-types = "0.97"
md-editor-plugin = {path = "crates/plugins/md-editor-plugin"}
plugin-sdk = {path = "crates/plugins/plugin-sdk"}
ropey = "1.6"
rust-i18n = "3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
tokio = {version = "1", features = ["sync", "rt", "rt-multi-thread"]}
toml = "0.8"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
wasm-widget-types = {path = "crates/widgets/wasm-widget-types"}
wasmi = "0.34"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
calamine = "0.26"
color-lsp = "0.2"
csv = "1.3"
dirs = "6"
gpui-wry = "0.5"
image = "0.25"
open = "5"
reqwest = {version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"]}
rfd = "0.15"
rust_xlsxwriter = "0.5"
smol = "2"
tempfile = "3"
tray-icon = "0.19"
tree-sitter-navi = "0.2"
# Plugin loading (cdylib)
libloading = "0.8"
# Credential Manager dependencies
aes-gcm = "0.10"
base64 = "0.22"
chrono = {version = "0.4", features = ["serde"]}
pbkdf2 = "0.12"
rand = "0.8"
rusqlite = {version = "0.31", features = ["bundled", "chrono"]}
sha2 = "0.10"
uuid = {version = "1.6", features = ["v4", "serde"]}
zeroize = {version = "1.7", features = ["derive"]}

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
gpui_web = {git = "https://github.com/zed-industries/zed"}
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2"

[target.'cfg(all(target_os = "linux", not(target_family = "wasm")))'.dependencies]
gtk = "0.18"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
strip = "debuginfo"

[profile.dev.package]
gpui = {opt-level = 3}
gpui-component = {opt-level = 3}
gpui-component-assets = {opt-level = 3}
gpui_platform = {opt-level = 3}
hashbrown = {opt-level = 3}

# [patch.crates-io]
# smol = { path = "patches/smol-wasm" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true

[workspace]
members = [
  "crates/plugins/plugin-sdk",
  "crates/plugins/network-plugin",
  "crates/plugins/notepad-plugin",
  "crates/widgets/wasm-widget-types",
  "crates/widgets/wasm-widget",
  "crates/plugins/md-editor-plugin",
  "crates/plugins/toolbox-plugin",
  "crates/plugins/credential-plugin",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ht-shaipe/kit-plugins"

[workspace.dependencies]
plugin-sdk = {path = "crates/plugins/plugin-sdk"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
wasm-widget-types = {path = "crates/widgets/wasm-widget-types"}
