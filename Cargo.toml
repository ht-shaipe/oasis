[package]
edition = "2024"
name = "oasis"
publish = false
version = "0.1.0"
authors = ["shaipe <shaipe@sina.com>"]

[package.metadata.bundle]
category = "Developer Tool"
icon = ["assets/icon.png"]
identifier = "com.example.oasis"
name = "oasis"

[package.metadata.i18n]
available-locales = ["en", "zh-CN"]
default-locale = "en"
load-path = "locales"

[build-dependencies]
rust-i18n = "3"

[features]
default = ["native-app"]
# Desktop binary (system tray, etc.). Omit for `wasm32` builds: `--no-default-features --lib`.
native-app = []

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "oasis"
path = "src/main.rs"
required-features = ["native-app"]

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

anyhow = "1"
autocorrect = "2.1.0"
futures = "0.3"
log = "0.4"
lsp-types = "0.97"
ropey = "1.6"
rust-i18n = "3"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sys-locale = "0.3"
tokio = {version = "1", features = ["sync", "rt", "rt-multi-thread"]}
inventory = "0.3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
wasmi = "0.34"
thiserror = "2"
libloading = "0.8"
wasm-plugin-types = { path = "crates/wasm-plugin-types" }
plugin-sdk = { path = "crates/plugin-sdk" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs = "6"
gpui-wry = "0.5"
image = "0.25"
reqwest = {version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"]}
tray-icon = "0.19"
calamine = "0.26"
rust_xlsxwriter = "0.5"
smol = "2"
color-lsp = "0.2"
tree-sitter-navi = "0.2"
rfd = "0.15"
csv = "1.3"
open = "5"
# Credential Manager dependencies
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.7", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
gpui_web = {git = "https://github.com/zed-industries/zed"}
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2"

[target.'cfg(all(target_os = "linux", not(target_family = "wasm")))'.dependencies]
gtk = "0.18"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
strip = "debuginfo"

[profile.dev.package]
gpui = {opt-level = 3}
gpui-component = {opt-level = 3}
gpui-component-assets = {opt-level = 3}
gpui_platform = {opt-level = 3}

# [patch.crates-io]
# smol = { path = "patches/smol-wasm" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true


[workspace]
members = [
    "crates/plugin-sdk",
	"crates/network-plugin",
	"crates/wasm-plugin",
	"crates/wasm-plugin-types",
	"crates/widget-calculator",
	"crates/widget-notepad",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ht-shaipe/kit-plugins"

[workspace.dependencies]
plugin-sdk = {path = "crates/plugin-sdk"}
wasm-plugin-types = {path = "crates/wasm-plugin-types"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
thiserror = "2"
